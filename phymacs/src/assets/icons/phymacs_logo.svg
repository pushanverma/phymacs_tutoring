<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- PhyMacs navbar logo mark, packaged as a favicon -->
  <defs>
    <clipPath id="rounded">
      <rect width="512" height="512" rx="112" ry="112"/>
    </clipPath>
  </defs>
  <g clip-path="url(#rounded)">
    <!-- deep navy background so the gold mark reads on any tab colour -->
    <rect width="512" height="512" fill="#101A30"/>
    <!-- mortarboard mark, scaled up from the 48x48 navbar SVG (x10.67) -->
    <g transform="translate(256,256) scale(9.4) translate(-24,-24)">
      <circle cx="24" cy="24" r="22" fill="#1B2A4A"/>
      <path d="M24 13l13 5.5-13 5.5-13-5.5L24 13z" fill="#D4A02A"/>
      <path d="M15 22v6c0 2.6 4 4.5 9 4.5s9-1.9 9-4.5v-6l-9 3.8L15 22z" fill="#F2D483"/>
    </g>
  </g>
</svg>
